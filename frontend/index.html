<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LSD-CDSS</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong
      // theme. "system" (or nothing saved) leaves data-theme unset, so the
      // prefers-color-scheme rule in index.css decides.
      try {
        var t = localStorage.getItem('lsd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
